<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — ZIVARK</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0F172A; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-wrap { width: 100%; max-width: 400px; padding: 1.5rem; }
  .login-brand { text-align: center; margin-bottom: 2rem; }
  .brand-logo { font-size: 2rem; font-weight: 900; color: #fff; letter-spacing: 0.08em; }
  .brand-logo span { color: #3B82F6; }
  .brand-tag { font-size: 0.7rem; color: #475569; text-transform: uppercase; letter-spacing: 0.12em; margin-top: 0.3rem; }
  .login-card { background: #1E293B; border: 1px solid #334155; border-radius: 12px; padding: 2rem; }
  .login-title { font-size: 1.1rem; font-weight: 700; color: #F1F5F9; margin-bottom: 0.3rem; }
  .login-sub { font-size: 0.78rem; color: #64748B; margin-bottom: 1.5rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #94A3B8; margin-bottom: 0.4rem; }
  .form-group input { width: 100%; background: #0F172A; border: 1.5px solid #334155; border-radius: 6px; padding: 0.65rem 0.875rem; font-size: 0.85rem; color: #F1F5F9; font-family: inherit; transition: border-color 0.15s; }
  .form-group input:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .form-group input::placeholder { color: #475569; }
  .btn-login { width: 100%; background: #3B82F6; color: #fff; border: none; border-radius: 6px; padding: 0.75rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem; letter-spacing: 0.02em; transition: all 0.15s; }
  .btn-login:hover { background: #2563EB; transform: translateY(-1px); }
  .error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 6px; padding: 0.65rem 0.875rem; font-size: 0.78rem; color: #F87171; margin-bottom: 1rem; }
  .login-footer { text-align: center; margin-top: 1.5rem; font-size: 0.7rem; color: #475569; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-brand">
    <div class="brand-logo">ZI<span>VARK</span></div>
    <div class="brand-tag">Industrial Packaging ERP</div>
  </div>
  <div class="login-card">
    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in to your account to continue</div>
    {% if messages %}
      {% for msg in messages %}
      <div class="error-msg">{{ msg }}</div>
      {% endfor %}
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-login">Sign In</button>
    </form>
  </div>
  <div class="login-footer">ZIVARK v1.0 — Industrial Packaging ERP</div>
</div>
</body>
</html>
